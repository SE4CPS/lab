<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshops</title>
<meta name="description" content="Workshops organized by Solomon Berhe.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400&family=IBM+Plex+Serif:wght@600&display=swap">
<style>
  :root {
    --bg: #fbfaf8;
    --ink: #1b1b21;
    --muted: #565b66;
    --faint: #878c96;
    --line: #e6e3dc;
    --accent: #1c3f60;
    --serif: "IBM Plex Serif", Georgia, serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131418; --ink: #e9e8e3; --muted: #a4a8b0;
      --faint: #767b85; --line: #2a2c32; --accent: #89b2da;
    }
  }
  :root[data-theme="dark"] {
    --bg: #131418; --ink: #e9e8e3; --muted: #a4a8b0;
    --faint: #767b85; --line: #2a2c32; --accent: #89b2da;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 38rem; margin: 0 auto; padding: 4.5rem 1.5rem 5rem; }
  a { color: var(--accent); text-underline-offset: 0.15em; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

  .eyebrow {
    font: 400 0.75rem/1 var(--mono);
    text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted);
    margin: 0 0 0.9rem;
  }
  h1 { margin: 0 0 2.5rem; font: 600 2rem/1.15 var(--serif); letter-spacing: -0.01em; }

  ul { list-style: none; margin: 0; padding: 0; }
  li { border-top: 1px solid var(--line); }
  li:last-child { border-bottom: 1px solid var(--line); }

  .item { display: block; padding: 1.3rem 0; text-decoration: none; color: inherit; }
  .item:hover .title { text-decoration: underline; text-decoration-color: var(--accent); }
  .title { font: 600 1.1rem/1.35 var(--serif); color: var(--ink); text-wrap: balance; }
  .acronym { color: var(--faint); font-weight: 500; }
  .metaline {
    margin-top: 0.4rem;
    font: 400 0.82rem/1.5 var(--mono);
    color: var(--muted);
    display: flex; flex-wrap: wrap; gap: 0.35rem 1rem;
  }
  .status {
    display: inline-block; margin-top: 0.7rem;
    font: 400 0.7rem/1 var(--mono);
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--faint);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 0.25rem 0.45rem;
  }

  footer { margin-top: 3rem; font: 400 0.8rem/1.6 var(--mono); color: var(--faint); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Solomon Berhe</p>
  <h1>Workshops</h1>

  <ul>
    <li>
      <a class="item" href="2027-edi40/">
        <span class="title">Agentic Software Updates <span class="acronym">(AgSU 2027)</span></span>
        <span class="metaline">
          <span>ANT and EDI40 2027</span>
          <span>Delft, the Netherlands</span>
          <span>13 to 15 April 2027</span>
        </span>
        <span class="status">Proposal under review</span>
      </a>
    </li>
  </ul>

  <footer>More to come.</footer>
</main>
</body>
</html>
