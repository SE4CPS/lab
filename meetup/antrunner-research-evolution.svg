<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2000" viewBox="0 0 1200 800" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-rendering="geometricPrecision">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>

  <!-- title -->
  <text x="600" y="240" text-anchor="middle" font-size="44" font-weight="700" fill="#1a1a1a">Which software update next?</text>

  <!-- stage 1 -->
  <rect x="105" y="365" width="210" height="150" rx="14" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5"/>
  <text x="210" y="447" text-anchor="middle" font-size="22" font-weight="600" fill="#1a1a1a">Changelogs</text>
  <text x="210" y="555" text-anchor="middle" font-size="15" font-weight="700" fill="#888" letter-spacing="0.5">HEURISTIC</text>

  <!-- stage 2 -->
  <rect x="365" y="365" width="210" height="150" rx="14" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5"/>
  <text x="470" y="447" text-anchor="middle" font-size="22" font-weight="600" fill="#1a1a1a">ML classifiers</text>
  <text x="470" y="555" text-anchor="middle" font-size="15" font-weight="700" fill="#888" letter-spacing="0.5">LEARNED</text>

  <!-- stage 3 -->
  <rect x="625" y="365" width="210" height="150" rx="14" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5"/>
  <text x="730" y="432" text-anchor="middle" font-size="22" font-weight="600" fill="#1a1a1a">Risk model</text>
  <text x="730" y="463" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a1a">n &#8594; n+1</text>
  <text x="730" y="555" text-anchor="middle" font-size="15" font-weight="700" fill="#888" letter-spacing="0.5">PROBABILISTIC</text>

  <!-- stage 4 -->
  <rect x="885" y="365" width="210" height="150" rx="14" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5"/>
  <text x="990" y="447" text-anchor="middle" font-size="22" font-weight="600" fill="#1a1a1a">Agentic AI</text>
  <text x="990" y="555" text-anchor="middle" font-size="15" font-weight="700" fill="#888" letter-spacing="0.5">REASONING</text>

  <!-- arrows -->
  <line x1="318" y1="440" x2="362" y2="440" stroke="#888" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="578" y1="440" x2="622" y2="440" stroke="#888" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="838" y1="440" x2="882" y2="440" stroke="#888" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- timeline -->
  <line x1="105" y1="625" x2="1000" y2="625" stroke="#ccc" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1095" y="631" text-anchor="end" font-size="15" fill="#999">today</text>
</svg>
