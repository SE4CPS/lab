<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Sensor Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; color: #333; text-align: center; }
        header { background: #0066cc; color: white; padding: 1rem 0; }
        #sensor-value { font-size: 2.5rem; margin: 2rem 0; }
        footer { font-size: 0.8rem; color: #666; margin-top: 3rem; }
    </style>
</head>
<body>
    <header>
        <h1>Light Sensor Dashboard</h1>
    </header>

    <main>
        <p>Current light level:</p>
        <div id="sensor-value">--</div>
        <button onclick="refreshValue()">Refresh</button>
    </main>

    <footer>
        &copy; 2026 Light Sensor Inc.
    </footer>

    <script>
        function refreshValue() {
            // Placeholder: in a real dashboard this would fetch from an API
            const value = Math.floor(Math.random() * 1000);
            document.getElementById('sensor-value').textContent = value + ' lx';
        }

        // auto refresh every 5 seconds
        setInterval(refreshValue, 5000);
        refreshValue();
    </script>
</body>
</html>
